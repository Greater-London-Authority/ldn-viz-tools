name: Lint PRs

on:
  pull_request:
    branches: ['dev', 'main']

  push:
    branches: ['dev', 'main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.2'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check docstrings are in sync with Storybook
        run: |
          npm run sync-docstrings
          if ! git diff --quiet -- 'packages/*/src/**'; then
            echo "Component docstrings and Storybook are not in sync"
            exit 1
          fi
